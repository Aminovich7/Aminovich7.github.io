<!doctype html>
<html lang="en" data-demo-lang="en">
<head>
  <meta name="robots" content="noindex">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff — Clinic CRM</title>
  <link rel="stylesheet" href="static/css/style.css?v=1">
  <link rel="icon" href="static/demo/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="static/demo/demo.css?v=1">
</head>
<body class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">Clinic CRM</div>
    <nav class="mainnav" id="mainnav" aria-label="Main menu"></nav>
  </aside>

  <div class="app-main">
    <header class="topbar">
      <h1 class="page-title" id="page-title"></h1>
      <div class="user-info">
        <span id="current-user-name"></span>
        <button id="logout-btn" class="secondary">Log out</button>
      </div>
    </header>
    <main class="container">
      
<h1>Staff</h1>

<div id="error-container"></div>
<div id="success-container"></div>

<div class="card">
  <form class="inline-form" id="filter-form">
    <div class="field">
      <label for="search">Search</label>
      <input type="text" id="search" placeholder="Name or specialty">
    </div>
    <div class="field">
      <label for="role-filter">Role</label>
      <select id="role-filter">
        <option value="">— all —</option>
        <option value="doctor">Doctor</option>
        <option value="nurse">Nurse</option>
        <option value="other">Other</option>
      </select>
    </div>
    <div class="field">
      <label for="status-filter">Status</label>
      <select id="status-filter">
        <option value="">— all —</option>
        <option value="active">Active</option>
        <option value="inactive">Inactive</option>
      </select>
    </div>
    <button type="submit">Search</button>
  </form>
</div>

<div class="card entry-card hidden" id="form-card">
  <h2 id="form-title">Add a staff member</h2>
  <form class="inline-form" id="staff-form">
    <input type="hidden" id="staff-id">
    <div class="field">
      <label for="first_name">First name</label>
      <input type="text" id="first_name" required>
    </div>
    <div class="field">
      <label for="last_name">Last name</label>
      <input type="text" id="last_name" required>
    </div>
    <div class="field">
      <label for="role">Role</label>
      <select id="role" required>
        <option value="doctor">Doctor</option>
        <option value="nurse">Nurse</option>
        <option value="other">Other</option>
      </select>
    </div>
    <div class="field" id="specialty-field">
      <label for="specialty">Specialty</label>
      <input type="text" id="specialty">
    </div>
    <div class="field" id="fixed-salary-field">
      <label for="fixed_salary">Monthly salary (so'm)</label>
      <input type="text" inputmode="numeric" id="fixed_salary">
    </div>
    <div class="field">
      <label for="hire_date">Hire date</label>
      <input type="date" id="hire_date" required>
    </div>
    <button type="submit" id="save-staff-btn">Save</button>
    <button type="button" class="secondary" id="cancel-form-btn">Cancel</button>
  </form>
</div>

<button id="add-staff-btn" class="hidden">+ Add a staff member</button>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Role</th>
        <th>Specialty / Salary</th>
        <th>Hire date</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="staff-tbody"></tbody>
  </table>
</div>

<div class="pagination" id="pagination"></div>

    </main>
  </div>

  <script src="static/demo/crm-mock.js?v=1"></script>
  <script src="static/demo/demo.js?v=1"></script>
  <script src="static/js/api.js?v=1"></script>
  <script src="static/js/auth.js?v=1"></script>
  <script src="static/js/nav.js?v=1"></script>
  
<script src="static/js/staff.js?v=1"></script>

</body>
</html>
