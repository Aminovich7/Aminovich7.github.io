<!doctype html>
<html lang="uz" data-demo-lang="uz">
<head>
  <meta name="robots" content="noindex">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ishchilar — Klinika CRM</title>
  <link rel="stylesheet" href="static/css/style.css?v=1">
  <link rel="icon" href="static/demo/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="static/demo/demo.css?v=1">
</head>
<body class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">Klinika CRM</div>
    <nav class="mainnav" id="mainnav" aria-label="Asosiy menyu"></nav>
  </aside>

  <div class="app-main">
    <header class="topbar">
      <h1 class="page-title" id="page-title"></h1>
      <div class="user-info">
        <span id="current-user-name"></span>
        <button id="logout-btn" class="secondary">Chiqish</button>
      </div>
    </header>
    <main class="container">
      
<h1>Ishchilar</h1>

<div id="error-container"></div>
<div id="success-container"></div>

<div class="card">
  <form class="inline-form" id="filter-form">
    <div class="field">
      <label for="search">Qidirish</label>
      <input type="text" id="search" placeholder="Ism, familiya yoki mutaxassislik">
    </div>
    <div class="field">
      <label for="role-filter">Lavozim</label>
      <select id="role-filter">
        <option value="">— barchasi —</option>
        <option value="doctor">Shifokor</option>
        <option value="nurse">Hamshira</option>
        <option value="other">Boshqa</option>
      </select>
    </div>
    <div class="field">
      <label for="status-filter">Holat</label>
      <select id="status-filter">
        <option value="">— barchasi —</option>
        <option value="active">Faol</option>
        <option value="inactive">Nofaol</option>
      </select>
    </div>
    <button type="submit">Qidirish</button>
  </form>
</div>

<div class="card entry-card hidden" id="form-card">
  <h2 id="form-title">Ishchi qo'shish</h2>
  <form class="inline-form" id="staff-form">
    <input type="hidden" id="staff-id">
    <div class="field">
      <label for="first_name">Ism</label>
      <input type="text" id="first_name" required>
    </div>
    <div class="field">
      <label for="last_name">Familiya</label>
      <input type="text" id="last_name" required>
    </div>
    <div class="field">
      <label for="role">Lavozim</label>
      <select id="role" required>
        <option value="doctor">Shifokor</option>
        <option value="nurse">Hamshira</option>
        <option value="other">Boshqa</option>
      </select>
    </div>
    <div class="field" id="specialty-field">
      <label for="specialty">Mutaxassislik</label>
      <input type="text" id="specialty">
    </div>
    <div class="field" id="fixed-salary-field">
      <label for="fixed_salary">Oylik maosh (so'm)</label>
      <input type="text" inputmode="numeric" id="fixed_salary">
    </div>
    <div class="field">
      <label for="hire_date">Ishga kirgan sana</label>
      <input type="date" id="hire_date" required>
    </div>
    <button type="submit" id="save-staff-btn">Saqlash</button>
    <button type="button" class="secondary" id="cancel-form-btn">Bekor qilish</button>
  </form>
</div>

<button id="add-staff-btn" class="hidden">+ Ishchi qo'shish</button>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>Ism-familiya</th>
        <th>Lavozim</th>
        <th>Mutaxassislik / Oylik</th>
        <th>Ishga kirgan sana</th>
        <th>Holat</th>
        <th>Amallar</th>
      </tr>
    </thead>
    <tbody id="staff-tbody"></tbody>
  </table>
</div>

<div class="pagination" id="pagination"></div>

    </main>
  </div>

  <script src="static/demo/crm-mock.js?v=1"></script>
  <script src="static/demo/demo.js?v=1"></script>
  <script src="static/js/api.js?v=1"></script>
  <script src="static/js/auth.js?v=1"></script>
  <script src="static/js/nav.js?v=1"></script>
  
<script src="static/js/staff.js?v=1"></script>

</body>
</html>
